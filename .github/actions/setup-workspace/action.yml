# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup workspace
description: Install the pinned Node.js and the root dependencies from the lockfile.

# Both workflows need this, so the setup-node inputs live here and nowhere else.
# Checkout cannot move in with them: the runner reads this file out of the
# checked-out repository, so a local action can never run before actions/checkout.
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: |
          package-lock.json
          desktop/package-lock.json

    - name: Install dependencies
      shell: bash
      run: npm ci
